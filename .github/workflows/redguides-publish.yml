name: Publish to RedGuides

on:
  push:
    branches:
      - "main"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare the release
        id: release
        env:
          BEFORE: ${{ github.event.before }}
          REDGUIDES_API_KEY: ${{ secrets.REDGUIDES_API_KEY }}
        run: |
          VERSION="$(date -u +%Y-%m-%d)"
          CURRENT=$(curl -sf -H "XF-Api-Key: $REDGUIDES_API_KEY" https://www.redguides.com/community/api/resources/1742 | jq -r '.resource.version // ""' || true)
          if [[ "$CURRENT" == "$VERSION"* ]]; then VERSION="$VERSION-${GITHUB_SHA::7}"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          RANGE=HEAD
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then RANGE="$BEFORE..HEAD"; fi
          git log --no-merges -n 50 --format="- %s ([%h]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/%H)) ~%an" "$RANGE" > rg_release_notes.md
          FILE="apitest.zip"
          git archive --format=zip --prefix=apitest/ -o "$FILE" HEAD -- . ':!.*' ':!*/.*'
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Publish to RedGuides
        uses: RedGuides/redguides-publish@v1
        env:
          REDGUIDES_API_KEY: ${{ secrets.REDGUIDES_API_KEY }}
        with:
          resource_id: "1742"
          version: ${{ steps.release.outputs.version }}
          message: rg_release_notes.md
          file: ${{ steps.release.outputs.file }}
          domain: "https://github.com/${{ github.repository }}/tree/${{ github.sha }}/"
