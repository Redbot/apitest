name: Publish to RedGuides

on:
  push:
    tags:
      - 'v[0-9]*'
      - 'V[0-9]*'
      - '[0-9]*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare the release
        id: release
        run: |
          VERSION_TAG='^[vV]?[0-9]+(\.[0-9]+)*([-+_]|$)'
          if [[ ! "$GITHUB_REF_NAME" =~ $VERSION_TAG ]]; then echo "$GITHUB_REF_NAME is not a version tag"; exit 0; fi
          VERSION="$GITHUB_REF_NAME"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          PREVIOUS=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          git log --no-merges -n 50 --format="- %s ([%h]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/%H)) ~%an" ${PREVIOUS:+"$PREVIOUS..HEAD"} > rg_release_notes.md
          FILE="apitest.zip"
          git archive --format=zip --prefix=apitest/ -o "$FILE" HEAD -- . ':!.*' ':!*/.*'
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Publish to RedGuides
        if: steps.release.outputs.version != ''
        uses: RedGuides/redguides-publish@v1
        env:
          REDGUIDES_API_KEY: ${{ secrets.REDGUIDES_API_KEY }}
        with:
          resource_id: "1742"
          version: ${{ steps.release.outputs.version }}
          message: rg_release_notes.md
          file: ${{ steps.release.outputs.file }}
          domain: "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/"
